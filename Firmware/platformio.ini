; Drone Swarm Failover - firmware for all boards.
;
; One binary runs on every board. The node ID lives in NVS flash, not in a
; build flag, so you flash the same firmware to D1..D8, ATK and SPARE and then
; set the ID once over serial with "SETID <n>" (see step 1.4).
;
; EVERYTHING that affects the binary is pinned exactly, not left as a range. A
; measurement run in week 9 has to be comparable with one from week 3, so
; nothing underneath the experiment may move on its own. Bump deliberately, and
; note the reason and the date in Docs/lab_notes.md when you do.
;
; Pinning the platform alone is NOT enough, which cost a day on 2026-11-15.
; espressif32 8.0.0 declares its own packages as ranges:
;
;     framework-arduinoespressif32              ~4.30312.0
;     framework-arduinoespressif32-esp32s3-libs ~3.3.12
;
; so two machines both on platform 8.0.0 picked up Arduino core builds
; 4.30312.261024 and 4.30312.261113 and produced binaries 116 KB apart from
; identical source. platform_packages below is what actually holds it still.

[env:heltec_v3]
platform = espressif32 @ 8.0.0
platform_packages =
  framework-arduinoespressif32 @ 4.30312.261113
  framework-arduinoespressif32-esp32s3-libs @ 3.3.12
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time, send_on_enter
; Without this the monitor shows nothing as you type, so SETID is entered blind.
monitor_echo = yes
; upload_speed deliberately left at the board definition's 460800. The V3 talks
; to the host through a CP2102 bridge and Heltec chose that figure; 921600 saves
; about 12 s per board, which is not worth risking a half-written flash.

lib_deps =
  jgromes/RadioLib @ 7.8.1
  olikraus/U8g2 @ 2.36.18

build_flags =
  -D SWARM_SIZE=8
  -Wall
  ; src/ on the include path, so every include reads from the project root
  ; ("comms/msg.h") instead of counting ../ hops out of a subfolder.
  -I src
